<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Outlet performance</title>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Outlet performance</h1>
        <div class="sub" id="range">Loading…</div>
      </div>
      <div class="seg" id="filter" role="group" aria-label="Filter by outlet"></div>
    </header>

    <div class="card state" id="error" role="alert" hidden>
      <h2>Couldn't load the dashboard data</h2>
      <p id="error-msg"></p>
      <button class="btn" id="retry" type="button">Try again</button>
    </div>

    <div id="dashboard">
      <section class="kpis" id="kpis"></section>
      <section class="grid">
        <div class="card">
          <h2>Sales as % of target</h2>
          <div class="hint">One bar per outlet-week</div>
          <div class="chart" id="chart"></div>
          <div class="xlabels" id="xlabels"></div>
          <div class="legend">
            <span><i style="background:var(--bar)"></i>90% or above</span>
            <span><i style="background:var(--bad)"></i>Below 90%</span>
          </div>
        </div>
        <div class="card">
          <h2>Needs attention</h2>
          <div class="hint">Outlet-weeks under 90% of target</div>
          <ul class="list" id="attention"></ul>
        </div>
      </section>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
